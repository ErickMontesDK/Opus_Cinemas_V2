services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opus_cinemas
      POSTGRES_USER: opus
      POSTGRES_PASSWORD: opus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opus -d opus_cinemas"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
